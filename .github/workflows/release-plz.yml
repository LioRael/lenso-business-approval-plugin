name: Source package policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-package-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Check repository boundary
        run: ./scripts/check-repository-boundary.sh
      - name: Verify private package policy
        run: python3 scripts/check-package-policy.py
