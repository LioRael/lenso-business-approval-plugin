[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-business-approval",
    "crates/lenso-business-approval-core",
    "crates/lenso-business-approval-d1-plugin",
    "crates/lenso-business-approval-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-business-approval-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso = "=0.5.28"
lenso-app-plan = "=0.4.6"
lenso-capability-secrets = "=0.1.4"
lenso-contract-runtime = "=0.2.0"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.19"
lenso-plugin-authoring = "=0.2.0"
lenso-postgres-kit = "=0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[patch.crates-io]
lenso = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-native-adapter = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-native-adapter-macros = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-kernel = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-app-plan = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-plugin-authoring = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-runtime-codec = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-runtime = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-authoring = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-authoring-macros = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
lenso-contract-codegen = { git = "https://github.com/LioRael/lenso", rev = "f670422953b42cc33b83a9b8cde9a4c74e9f6ceb" }
