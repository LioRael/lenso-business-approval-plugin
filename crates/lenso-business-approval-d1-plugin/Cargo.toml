[package]
name = "lenso-business-approval-d1-plugin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
[package.metadata.lenso]
plugin-id = "lenso.business-approval.d1"
