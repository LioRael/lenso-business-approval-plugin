lenso-business-approval-core = {path="../lenso-business-approval-core",version="0.1.0"}
lenso-capability-business-approval = {path="../lenso-capability-business-approval",version="0.1.0"}
serde.workspace = true
serde_json.workspace = true
time.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
serde-wasm-bindgen = "0.6"
[lints]
workspace = true
